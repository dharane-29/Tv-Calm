name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest   # ships with the Android SDK; ANDROID_HOME is preset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python3 tvcalm.py build
      - uses: actions/upload-artifact@v4
        with:
          name: calmhome
          path: out/
