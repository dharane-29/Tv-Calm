# On-device check: boots an Android TV emulator, installs the built APK, drives it with
# remote-control keys and fails if it crashes or the expected tiles/dialog don't appear.
# Run manually: Actions > emulator-smoke > Run workflow. Uploads screenshots as artifacts.
name: emulator-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python3 tests/run_all.py
      - run: python3 tvcalm.py build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-out/
